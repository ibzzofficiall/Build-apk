name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project"
        required: true
        type: string
      tag:
        description: "Build tag / job_id"
        required: true
        type: string
      job_id:
        description: "Job ID (alias tag)"
        required: false
        type: string
      owner_id:
        description: "User ID"
        required: false
        type: string
      build_type:
        description: "release atau debug"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
      only_analyze:
        description: "Cuma analyze aja?"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g"
      CI: "true"

    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Download project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project_raw project.zip
          curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --connect-timeout 20 --max-time 1800 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ inputs.zip_url }}" -o project.zip
          test -s project.zip
          unzip -tq project.zip
          mkdir -p project_raw
          unzip -q project.zip -d project_raw

      - name: Detect project root
        id: detect_root
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning extracted project..."
          ROOT=""
          while IFS= read -r pubspec; do
            [ -z "$pubspec" ] && continue
            candidate="$(dirname "$pubspec")"
            if [ -d "$candidate/android" ]; then
              ROOT="$candidate"
              break
            fi
          done < <(find project_raw -type f -name "pubspec.yaml" -print)

          if [ -z "$ROOT" ]; then
            first_pubspec="$(find project_raw -type f -name "pubspec.yaml" -print -quit || true)"
            if [ -n "$first_pubspec" ]; then
              ROOT="$(dirname "$first_pubspec")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            first_gradle="$(find project_raw -type f -name "gradlew" -print -quit || true)"
            if [ -n "$first_gradle" ]; then
              ROOT="$(dirname "$(dirname "$first_gradle")")"
              [ -f "$ROOT/gradlew" ] || ROOT="$(dirname "$first_gradle")"
            fi
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::ZIP does not contain pubspec.yaml or gradlew"
            exit 1
          fi

          ROOT="$(realpath "$ROOT")"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Detected: $ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter stable
        if: env.PROJECT_ROOT != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze only
        if: ${{ inputs.only_analyze == true }}
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter analyze

      - name: Prepare project
        if: env.PROJECT_ROOT != '' && inputs.only_analyze == false
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.yaml ]; then
            flutter --version
            flutter clean || true
            flutter pub get
          fi
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build APK
        if: env.PROJECT_ROOT != '' && inputs.only_analyze == false
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.yaml ]; then
            if [ "${{ inputs.build_type }}" = "debug" ]; then
              flutter build apk --debug
            else
              flutter build apk --release
            fi
          elif [ -f gradlew ]; then
            ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }} --no-daemon
          elif [ -f android/gradlew ]; then
            cd android && ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }} --no-daemon
          fi

      - name: Locate APK
        if: inputs.only_analyze == false
        shell: bash
        run: |
          APK="$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" ! -path "*/.gradle/*" -print -quit || true)"
          [ -z "$APK" ] && { echo "APK not found"; exit 3; }
          mkdir -p output && cp "$APK" output/app.apk
          ls -lh output/

      - name: Upload APK
        if: inputs.only_analyze == false
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag || inputs.job_id }}
          path: output/app.apk
          retention-days: 3
          if-no-files-found: error
