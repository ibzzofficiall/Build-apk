name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project"
        required: true
        type: string
      tag:
        description: "Build tag / job_id"
        required: true
        type: string
      job_id:
        description: "Job ID alias"
        required: false
        type: string
      owner_id:
        description: "User ID"
        required: false
        type: string
      build_type:
        description: "release atau debug"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
      only_analyze:
        description: "Cuma analyze aja?"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g"
      CI: "true"

    steps:
      - name: Checkout helper
        uses: actions/checkout@v4

      - name: Download project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project_raw project.zip output
          curl -L --fail --retry 5 --connect-timeout 20 --max-time 1800 \
            -H "Authorization: Bearer ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ inputs.zip_url }}" -o project.zip
          mkdir -p project_raw
          unzip -q project.zip -d project_raw

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find project_raw -type f -name "pubspec.yaml" -print | head -n1 | xargs dirname || true)"
          if [ -z "$ROOT" ]; then
            ROOT="$(find project_raw -type f -name "gradlew" -print | head -n1 | xargs dirname | xargs dirname || true)"
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::pubspec.yaml / gradlew not found"
            exit 1
          fi
          echo "PROJECT_ROOT=$(realpath "$ROOT")" >> $GITHUB_ENV
          echo "Detected: $(realpath "$ROOT")"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch Gradle + AGP 9 Fix
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== BEFORE PATCH ==="
          cat android/gradle/wrapper/gradle-wrapper.properties || true
          cat android/gradle.properties || true

          # 1. Upgrade Gradle 8.12.0 -> 8.14.0 (wajib Flutter terbaru)
          sed -i 's|gradle-.*-all.zip|gradle-8.14-all.zip|g' android/gradle/wrapper/gradle-wrapper.properties || true

          # 2. Fix AGP 9 new DSL error
          if grep -q "android.newDsl" android/gradle.properties 2>/dev/null; then
            sed -i 's/android.newDsl=.*/android.newDsl=false/' android/gradle.properties
          else
            echo "android.newDsl=false" >> android/gradle.properties
          fi

          # 3. Tambahan biar build stabil
          if ! grep -q "android.useAndroidX" android/gradle.properties 2>/dev/null; then
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

          echo "=== AFTER PATCH ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle.properties

      - name: Prepare project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter clean || true
          flutter pub get
          chmod +x android/gradlew || true
          chmod +x gradlew || true

      - name: Build APK with bypass flag
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug --android-skip-build-dependency-validation -v
          else
            flutter build apk --release --android-skip-build-dependency-validation -v
          fi

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" ! -path "*/.gradle/*" -print | head -n1)"
          if [ -z "$APK" ]; then echo "APK not found"; exit 3; fi
          mkdir -p output
          cp "$APK" output/app.apk
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag || inputs.job_id }}
          path: output/app.apk
          retention-days: 3
          if-no-files-found: error
